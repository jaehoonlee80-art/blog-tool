<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블로그랩</title>
<style>
  :root{
    --ink:#0E1525; --ink2:#39445A; --muted:#6C7789; --faint:#98A2B3;
    --line:#E5E8EF; --bg:#F6F8FA; --brand:#03C75A; --brand-soft:#E6F9EF; --danger:#E5484D;
  }
  *{box-sizing:border-box}
  body{
    margin:0; width:336px; background:#fff; color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
                "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    font-size:12.5px; line-height:1.5; letter-spacing:-0.012em;
    -webkit-font-smoothing:antialiased;
  }
  header{display:flex; align-items:center; gap:9px; padding:13px 14px 11px; border-bottom:1px solid var(--line)}
  .logo{width:26px;height:26px;border-radius:8px;flex:none;background:linear-gradient(145deg,#05D866,#02B14F);
        display:grid;place-items:center;box-shadow:0 5px 12px -7px rgba(3,199,90,.9)}
  .brand{font-size:13.5px;font-weight:800;letter-spacing:-0.03em}
  .brand small{display:block;font-size:9.5px;color:var(--faint);font-weight:700;letter-spacing:.04em;margin-top:-1px}
  .ver{margin-left:auto;font-size:9.5px;font-weight:700;color:var(--faint);background:var(--bg);
       border:1px solid var(--line);border-radius:99px;padding:2px 7px}
  .sec{padding:12px 14px;border-bottom:1px solid var(--line)}
  .sec-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .sec-head h2{margin:0;font-size:11.5px;font-weight:800;letter-spacing:-0.01em}
  .sec-head .cnt{margin-left:auto;font-size:10px;color:var(--faint);font-weight:700}
  .row{display:flex;align-items:center;gap:9px;padding:8px 9px;border:1px solid var(--line);
       border-radius:9px;background:#FDFEFE;margin-bottom:6px}
  .row .nm{font-size:11.5px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .x{width:20px;height:20px;border:0;border-radius:6px;background:transparent;color:#B6BFCC;
          display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
  .row .x:hover{background:#FDECEC;color:var(--danger)}
  .empty{padding:12px 8px;text-align:center;color:var(--faint);font-size:11px;line-height:1.6}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .switch .lb{font-size:11.5px;font-weight:700}
  .switch .lb small{display:block;font-size:10px;color:var(--faint);font-weight:600}
  .toggle{position:relative;width:38px;height:22px;border:0;border-radius:99px;background:#D9DEE7;
          padding:0;cursor:pointer;transition:.18s;flex:none}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:99px;
                 background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.18s}
  .toggle[aria-pressed="true"]{background:var(--brand)}
  .toggle[aria-pressed="true"]::after{transform:translateX(16px)}
  form{display:flex;flex-direction:column;gap:6px}
  input,textarea{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;
    font-size:11.5px;color:var(--ink);outline:none;background:#fff;transition:.15s;
  }
  input:focus,textarea:focus{border-color:#8FE3B4;box-shadow:0 0 0 3px rgba(3,199,90,.12)}
  textarea{min-height:64px;resize:vertical;line-height:1.6}
  .form-row{display:flex;gap:6px}
  .form-row input{flex:1}
  button.primary{
    border:1px solid #02A94D;border-radius:8px;padding:7px 11px;font:inherit;font-size:11.5px;font-weight:800;
    color:#fff;background:linear-gradient(180deg,#05CE5D,#03BB55);cursor:pointer;white-space:nowrap;
    box-shadow:0 6px 14px -9px rgba(3,199,90,.9)
  }
  button.primary:hover{background:linear-gradient(180deg,#06D763,#04C258)}
  button.ghost{
    border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:11.5px;font-weight:700;
    color:var(--ink2);background:#fff;cursor:pointer;white-space:nowrap
  }
  button.ghost:hover{background:#F7F9FB}
  footer{padding:10px 14px 12px;display:flex;align-items:center;gap:8px}
  footer button{margin-left:auto}
  .note{font-size:10px;color:var(--faint);line-height:1.5}
  .toast{position:fixed;left:50%;bottom:12px;transform:translate(-50%,10px);opacity:0;
         background:#0E1525;color:#fff;font-size:11px;font-weight:700;padding:6px 11px;border-radius:8px;
         transition:.2s;pointer-events:none;z-index:9}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M5 18V11M12 18V5M19 18v-4" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="brand">블로그랩<small>NAVER BLOG HELPER</small></div>
    <span class="ver">v1.0.0</span>
  </header>

  <section class="sec">
    <div class="switch">
      <span class="lb">글쓰기 화면 도우미<small>blog.naver.com 글쓰기에서 표시</small></span>
      <button class="toggle" id="barToggle" aria-pressed="true" aria-label="도우미 바 표시"></button>
    </div>
  </section>

  <section class="sec">
    <div class="sec-head">
      <h2>빠른 서식</h2>
      <span class="cnt" id="tplCount">0개</span>
    </div>
    <div id="list"></div>
    <form id="addForm">
      <div class="form-row">
        <input id="tplName" maxlength="40" placeholder="서식 이름 (예: 마무리 인사)" autocomplete="off">
      </div>
      <textarea id="tplBody" placeholder="도우미 바에서 커서 위치에 들어갈 내용"></textarea>
      <div class="form-row">
        <button type="submit" class="primary">서식 추가</button>
        <button type="button" class="ghost" id="openWrite">글쓰기 열기</button>
      </div>
    </form>
  </section>

  <footer>
    <span class="note">저장한 서식은 이 브라우저에만 보관됩니다.</span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
